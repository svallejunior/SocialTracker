# Configuração Nginx para SocialTracker
server {
    server_name 137-131-202-56.sslip.io 137.131.202.56 _;

    # Tamanho máximo de upload (vídeos Reels e mídias de alta resolução)
    client_max_body_size 150M;

    # Timeouts estendidos para chamadas longas de ingestão de dados e scraping
    proxy_read_timeout 900s;
    proxy_connect_timeout 900s;
    proxy_send_timeout 900s;

    # Servir arquivos de automação (fotos e vídeos) diretamente via URL
    location /automacao/ {
        alias /var/www/socialtracker/automacao/;
        expires 30d;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Arquivos estáticos servidos diretamente ou com cache (Next.js static assets)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Headers de Proxy Reverso
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Logs customizados
    access_log /var/log/nginx/socialtracker_access.log;
    error_log /var/log/nginx/socialtracker_error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/137-131-202-56.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/137-131-202-56.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name 137-131-202-56.sslip.io 137.131.202.56 _;
    return 301 https://$host$request_uri;
}
