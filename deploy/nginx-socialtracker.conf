# Configuração Nginx para SocialTracker
# Copiar para: /etc/nginx/sites-available/socialtracker
# Ativar com: sudo ln -s /etc/nginx/sites-available/socialtracker /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Substitua pelo seu domínio (ex: tracker.seudominio.com) ou mantenha '_' para IP público

    # Tamanho máximo de upload (vídeos Reels e mídias de alta resolução)
    client_max_body_size 150M;

    # Timeouts estendidos para chamadas longas de ingestão de dados e scraping
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Headers de Proxy Reverso
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Arquivos estáticos servidos diretamente ou com cache (Next.js static assets)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Logs customizados
    access_log /var/log/nginx/socialtracker_access.log;
    error_log /var/log/nginx/socialtracker_error.log;
}
